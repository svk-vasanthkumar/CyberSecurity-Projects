<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <!-- Background gradient: deep space black to dark navy -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050810"/>
      <stop offset="50%" style="stop-color:#080d1a"/>
      <stop offset="100%" style="stop-color:#040a0f"/>
    </linearGradient>

    <!-- Cyan glow for shield -->
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:0"/>
    </radialGradient>

    <!-- Center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" style="stop-color:#0a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1"/>
    </radialGradient>

    <!-- Grid fade mask -->
    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.04"/>
      <stop offset="60%" style="stop-color:white;stop-opacity:0.02"/>
      <stop offset="100%" style="stop-color:white;stop-opacity:0"/>
    </linearGradient>

    <mask id="gridMask">
      <rect width="900" height="280" fill="url(#gridFade)"/>
    </mask>

    <!-- Pulse animation filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- Subtle grid lines - horizontal -->
  <g mask="url(#gridMask)" stroke="#1a3a5c" stroke-width="0.4" opacity="0.6">
    <line x1="0" y1="35" x2="900" y2="35"/>
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="105" x2="900" y2="105"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="175" x2="900" y2="175"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="0" y1="245" x2="900" y2="245"/>
  </g>

  <!-- Subtle grid lines - vertical -->
  <g mask="url(#gridMask)" stroke="#1a3a5c" stroke-width="0.4" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="180" y1="0" x2="180" y2="280"/>
    <line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="420" y1="0" x2="420" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="540" y1="0" x2="540" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="660" y1="0" x2="660" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
    <line x1="780" y1="0" x2="780" y2="280"/>
    <line x1="840" y1="0" x2="840" y2="280"/>
  </g>

  <!-- Left circuit traces -->
  <g opacity="0.35" stroke="#00b8cc" stroke-width="1" fill="none">
    <polyline points="30,80 70,80 70,120 130,120"/>
    <polyline points="30,160 90,160 90,200 150,200"/>
    <circle cx="70" cy="80" r="2.5" fill="#00c8dd" stroke="none"/>
    <circle cx="70" cy="120" r="2.5" fill="#00c8dd" stroke="none"/>
    <circle cx="90" cy="160" r="2.5" fill="#00c8dd" stroke="none"/>
    <polyline points="20,50 50,50 50,90"/>
    <polyline points="20,210 60,210 60,180 100,180"/>
    <circle cx="50" cy="50" r="2" fill="#0099aa" stroke="none"/>
    <circle cx="60" cy="210" r="2" fill="#0099aa" stroke="none"/>
  </g>

  <!-- Right circuit traces (mirrored) -->
  <g opacity="0.35" stroke="#00b8cc" stroke-width="1" fill="none">
    <polyline points="870,80 830,80 830,120 770,120"/>
    <polyline points="870,160 810,160 810,200 750,200"/>
    <circle cx="830" cy="80" r="2.5" fill="#00c8dd" stroke="none"/>
    <circle cx="830" cy="120" r="2.5" fill="#00c8dd" stroke="none"/>
    <circle cx="810" cy="160" r="2.5" fill="#00c8dd" stroke="none"/>
    <polyline points="880,50 850,50 850,90"/>
    <polyline points="880,210 840,210 840,180 800,180"/>
    <circle cx="850" cy="50" r="2" fill="#0099aa" stroke="none"/>
    <circle cx="840" cy="210" r="2" fill="#0099aa" stroke="none"/>
  </g>

  <!-- Animated scanning line -->
  <line x1="160" y1="0" x2="160" y2="280" stroke="#00f0ff" stroke-width="0.5" opacity="0">
    <animate attributeName="x1" from="200" to="700" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="200" to="700" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.15;0.15;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Shield glow backdrop -->
  <ellipse cx="450" cy="130" rx="90" ry="90" fill="url(#shieldGlow)">
    <animate attributeName="rx" values="85;95;85" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="85;95;85" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Shield icon (left panel) -->
  <g transform="translate(175, 90)" filter="url(#glow)">
    <!-- Shield path -->
    <path d="M38,0 L76,14 L76,42 C76,62 57,76 38,82 C19,76 0,62 0,42 L0,14 Z"
          fill="none" stroke="#00e5ff" stroke-width="1.8" opacity="0.9"/>
    <!-- Shield inner glow fill -->
    <path d="M38,0 L76,14 L76,42 C76,62 57,76 38,82 C19,76 0,62 0,42 L0,14 Z"
          fill="#00e5ff" opacity="0.04"/>
    <!-- Checkmark inside shield -->
    <polyline points="20,40 32,52 56,28" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- Pulse ring around shield -->
    <ellipse cx="38" cy="41" rx="48" ry="50" fill="none" stroke="#00e5ff" stroke-width="0.6" opacity="0">
      <animate attributeName="rx" from="44" to="65" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="ry" from="46" to="67" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.4" to="0" dur="2.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Main title -->
  <text x="450" y="108" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="38" font-weight="bold" letter-spacing="6"
        fill="#e8f4ff" filter="url(#glow)">CYBERSECURITY</text>

  <!-- Subtitle accent line -->
  <line x1="310" y1="118" x2="590" y2="118" stroke="#00e5ff" stroke-width="0.7" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="450" y="148" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="13" letter-spacing="4"
        fill="#00c8dd" opacity="0.9">P R O J E C T S</text>

  <!-- Tagline -->
  <text x="450" y="178" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="11.5" letter-spacing="1.5"
        fill="#7ab8cc" opacity="0.85">Learn  ·  Build  ·  Break  ·  Defend</text>

  <!-- Stats row -->
  <!-- 42 Projects pill -->
  <g transform="translate(284, 198)">
    <rect x="0" y="0" width="98" height="22" rx="11" fill="#0d2035" stroke="#00c8dd" stroke-width="0.8" opacity="0.9"/>
    <text x="49" y="15.5" text-anchor="middle" font-family="'Courier New', Courier, monospace"
          font-size="10" fill="#00c8dd" letter-spacing="0.5">📦 42 Projects</text>
  </g>

  <!-- 18 Domains pill -->
  <g transform="translate(401, 198)">
    <rect x="0" y="0" width="98" height="22" rx="11" fill="#0d2035" stroke="#00c8dd" stroke-width="0.8" opacity="0.9"/>
    <text x="49" y="15.5" text-anchor="middle" font-family="'Courier New', Courier, monospace"
          font-size="10" fill="#00c8dd" letter-spacing="0.5">🌐 18 Domains</text>
  </g>

  <!-- Open Source pill -->
  <g transform="translate(518, 198)">
    <rect x="0" y="0" width="98" height="22" rx="11" fill="#0d2035" stroke="#00c8dd" stroke-width="0.8" opacity="0.9"/>
    <text x="49" y="15.5" text-anchor="middle" font-family="'Courier New', Courier, monospace"
          font-size="10" fill="#00c8dd" letter-spacing="0.5">⚡ Open Source</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="450" y="233" width="8" height="14" fill="#00e5ff" opacity="0.8" rx="1">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom terminal line -->
  <text x="450" y="244" text-anchor="middle"
        font-family="'Courier New', Courier, monospace"
        font-size="9" letter-spacing="1"
        fill="#2a6a7a" opacity="0.7">[ svk-vasanthkumar/Cybersecurity-Projects ]</text>

  <!-- Top border accent -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Bottom border accent -->
  <line x1="0" y1="279" x2="900" y2="279" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Corner accents TL -->
  <polyline points="0,20 0,0 20,0" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner accents TR -->
  <polyline points="880,0 900,0 900,20" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner accents BL -->
  <polyline points="0,260 0,280 20,280" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Corner accents BR -->
  <polyline points="880,280 900,280 900,260" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.7"/>
</svg>
